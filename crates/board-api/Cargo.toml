[package]
name = "board-api"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Loopback REST interface for Board"

[dependencies]
anyhow = "1"
base64 = "0.22"
percent-encoding = "2"
uuid = {version="1",features=["v4"]}
axum = "0.8"
board-local = {path = "../board-core"}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time"] }
futures-util = "0.3"
serde_urlencoded = "0.7"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
tower = {version = "0.5", features = ["util"]}
tempfile = "3"
