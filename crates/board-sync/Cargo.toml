[package]
name = "board-sync"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Explicit opt-in provider adapters for the local board"

[dependencies]
anyhow = "1"
board-local = { path = "../board-core" }
chrono = { version = "0.4", features = ["serde"] }
percent-encoding = "2"
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
