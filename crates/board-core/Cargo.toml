[package]
name = "board-local"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "SQLite storage and domain model for Board"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled", "backup", "functions", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }
url = "2"
fluent-uri = "0.3"
rhai = {version="1.25.1",default-features=false,features=["std","serde","no_module","no_time"]}
jsonschema = { version = "0.30", default-features = false }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = {version="0.13",default-features=false}

tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
flate2 = "1"
