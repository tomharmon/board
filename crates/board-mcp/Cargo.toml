[package]
name = "board-mcp"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Local Board tools over Model Context Protocol stdio"

[dependencies]
anyhow = "1"
base64 = "0.22"
board-local = { path = "../board-core", features = ["schemars"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.11", default-features = false, features = ["server"] }
schemars = "1"
jsonschema = { version = "0.30", default-features = false }
uuid = { version = "1", features = ["v4"] }
