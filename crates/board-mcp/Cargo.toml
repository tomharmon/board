[package]
name = "board-mcp"
version = "0.1.0"
edition = "2024"
license.workspace = true
description = "Local Board tools over Model Context Protocol stdio"

[dependencies]
anyhow = "1"
board-local = { path = "../board-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
