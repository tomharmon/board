[package]
name = "board-cli"
version = "0.1.0"
edition = "2024"
description = "A local SQLite message board for people and agents"
license = "Apache-2.0"
default-run = "board"

[[bin]]
name = "board"
path = "src/main.rs"

[dependencies]
board-local = { path = "../board-core" }
board-api = { path = "../board-api" }
board-sync = { path = "../board-sync" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
humantime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook-registry = "1"

[dev-dependencies]
tempfile = "3"
