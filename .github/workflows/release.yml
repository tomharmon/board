name: Native packages

on:
  workflow_dispatch:
  pull_request:
    paths: ['packaging/**', '.github/workflows/release.yml']
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: '1.100.0'
  CARGO_INCREMENTAL: '0'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - id: version
        run: |
          tag="v$(python3 packaging/release.py version)"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            test "$GITHUB_REPOSITORY" = tomharmon/board
            python3 packaging/release.py version "$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: python3 -m unittest discover -s packaging -p 'test_*.py'

  linux:
    needs: metadata
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
          sudo apt-get update
          sudo apt-get install -y makepkg pacman-package-manager fakeroot libarchive-tools zstd desktop-file-utils pkg-config libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libvulkan-dev mesa-vulkan-drivers
      - run: cargo build --release --locked -p board-cli -p board-ui --bins
      - run: python3 packaging/linux.py build "$TAG"
      - run: python3 packaging/linux.py verify "$TAG"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-linux
          path: target/packages/*
          if-no-files-found: error
          compression-level: 0

  macos:
    needs: metadata
    runs-on: macos-15
    environment: ${{ github.event_name == 'push' && 'release' || 'packaging-check' }}
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target x86_64-apple-darwin,aarch64-apple-darwin
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked --target "$target" -p board-cli -p board-ui --bins
          done
          bash packaging/macos/bundle.sh "$TAG"
      - name: Sign, notarize and staple (mandatory for releases)
        if: github.event_name == 'push'
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash packaging/macos/sign.sh
      - name: Local-only ad hoc signature for preflight
        if: github.event_name != 'push'
        run: |
          codesign --force --sign - target/package-mac/Board.app/Contents/MacOS/board
          codesign --force --sign - target/package-mac/Board.app
      - env:
          MODE: ${{ github.event_name == 'push' && 'release' || 'preview' }}
        run: bash packaging/macos/verify.sh "$TAG" "$MODE"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-macos
          path: target/packages/*
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: metadata
    runs-on: windows-2025
    environment: ${{ github.event_name == 'push' && 'release' || 'packaging-check' }}
    permissions: {contents: read, id-token: write}
    env:
      TAG: ${{ needs.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      - run: ./packaging/windows/build.ps1 binaries $env:TAG
      - name: Authenticate to the signing profile (OIDC)
        if: github.event_name == 'push'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign both executables
        if: github.event_name == 'push'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: |-
            ${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\board.exe
            ${{ github.workspace }}\target\x86_64-pc-windows-msvc\release\board-ui.exe
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
      - run: ./packaging/windows/build.ps1 msi $env:TAG
      - name: Sign Windows Installer package
        if: github.event_name == 'push'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\packages\Board-Windows-x64.msi
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
      - run: ./packaging/windows/verify.ps1 $env:TAG -Signed:($env:GITHUB_EVENT_NAME -eq 'push')
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-windows
          path: target/packages/Board-Windows-x64.msi
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'push'
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    environment: release
    permissions: {contents: write, id-token: write, attestations: write}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-*
          merge-multiple: true
          path: target/packages
      - run: python3 packaging/release.py checksums target/packages
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: target/packages/*
          create-storage-record: false
      - name: Publish only a complete, verified set; never replace an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "Board $GITHUB_REF_NAME" target/packages/*
