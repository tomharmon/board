name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Install Linux UI libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libx11-dev \
            libvulkan-dev \
            mesa-vulkan-drivers \
            desktop-file-utils \
            libglib2.0-bin

      - name: Test packaging and local installer
        run: python3 -m unittest discover -s packaging -p 'test_*.py'

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

  mac-local-install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test installer logic
        run: python3 -m unittest discover -s packaging -p 'test_*.py'

      - name: Build and install local app
        run: python3 packaging/install_local.py

      - name: Verify installed app and upgrade
        run: |
          python3 packaging/install_local.py --no-build
          plutil -lint "$HOME/Applications/Board.app/Contents/Info.plist"
          codesign --verify --deep --strict "$HOME/Applications/Board.app"
          test -L "$HOME/.local/bin/board"
          test -L "$HOME/.local/bin/board-ui"
          "$HOME/.local/bin/board" --version
          "$HOME/.local/bin/board-ui" --ui-notices
          iconutil -c iconset "$HOME/Applications/Board.app/Contents/Resources/Board.icns" -o target/installed-Board.iconset
